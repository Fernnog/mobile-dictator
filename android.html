<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4f46e5">
    <title>Ditado Mobile</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="android-app">

    <div id="appContainer" class="container">
        
        <header class="app-header">
            <div class="header-title">
                <h1>Ditado <span class="badge-pro">PRO</span></h1>
                <!-- Toggle Whisper discreto no header -->
                <div class="engine-selector-container mobile-header-toggle">
                    <label class="toggle-switch">
                        <input type="checkbox" id="engineToggle">
                        <span class="slider round"></span>
                    </label>
                    <span class="engine-label" id="engineLabel">Nativo</span>
                </div>
            </div>
        </header>

        <div id="statusMsg" class="status-bar"></div>

        <div class="editor-area">
            <textarea id="transcriptionArea" placeholder="Toque no microfone e comece a falar..." spellcheck="false"></textarea>
            <div class="editor-footer">
                <span id="charCount">0 caracteres</span>
                <div class="footer-actions">
                    <canvas id="audioVisualizer" width="100" height="24" title="Feedback de Áudio"></canvas>
                    <button id="focusModeBtn" class="btn-help" title="Modo Foco" onclick="document.body.classList.toggle('focus-mode')">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Dock: 5 botões redondos, sem texto -->
        <div class="control-dock" id="mainDock">
            <button id="exportBtn" class="btn-action btn-export" aria-label="Exportar TXT">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </button>

            <button id="aiFixBtn" class="btn-action btn-magic" aria-label="Corrigir Texto">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            </button>

            <button id="micBtn" class="btn-action btn-mic" aria-label="Gravar">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
            </button>

            <button id="aiLegalBtn" class="btn-action btn-legal" aria-label="Converter para Juridiquês">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></svg>
            </button>

            <button id="copyBtn" class="btn-action btn-copy" aria-label="Copiar Tudo">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>

            <button id="clearBtn" class="btn-action btn-clear" aria-label="Limpar Tudo">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script type="module" src="js/android.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js', { scope: './' })
                    .catch(err => console.error('SW Mobile:', err));
            });
        }
    </script>
</body>
</html>
